name: Deploy scamfreezer.com

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install site dependencies
        # Pulls textfreezer from npm at the version pinned in demo/package.json.
        working-directory: ./demo
        run: npm install

      - name: Build site
        working-directory: ./demo
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./demo/public
          cname: scamfreezer.com
